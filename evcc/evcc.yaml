# network settings for the evcc UI
# replaces the old top-level "uri: 0.0.0.0:7070" syntax
network:
  schema: http
  host: 0.0.0.0
  port: 7070

# control cycle interval
interval: 10s

# sponsor token enables optional features
# request at https://cloud.evcc.io
# required for some charger integrations, for example go-e in newer evcc versions
# sponsortoken:

# log settings
log: info
levels:
  core: info
  lp-1: info
  lp-2: info

# meter definitions
# name can be freely chosen and is used as reference when assigning meters to site and loadpoints
# for examples see https://docs.evcc.io/docs/devices/meters
meters:
  - name: grid
    type: custom
    power:
      source: mqtt
      topic: solar/power/export_power_hybrid
      scale: -1.0

  - name: pv
    type: custom
    power:
      source: mqtt
      topic: solar/power/total_dc_power
    currents:
      - source: mqtt
        topic: solar/power/current/phase_1
      - source: mqtt
        topic: solar/power/current/phase_b
      - source: mqtt
        topic: solar/power/current/phase_c

  - name: battery
    type: custom
    power:
      source: mqtt
      topic: solar/battery/battery_power
    soc:
      source: mqtt
      topic: solar/battery/battery_level

# charger definitions
# name can be freely chosen and is used as reference when assigning charger to loadpoints
# for examples see https://docs.evcc.io/docs/devices/chargers
#
# NOTE:
# In evcc 0.319.0, go-e may require sponsorship.
# Without a valid sponsortoken, evcc may fail with:
# "cannot create charger type 'go-e': sponsorship required"
chargers:
  - name: wallbox
    type: go-e
    uri: http://192.168.178.51

# vehicle definitions
# name can be freely chosen and is used as reference when assigning vehicle to loadpoints
# for examples see https://docs.evcc.io/docs/devices/vehicles
#
# vehicles:
#   - name: car1
#     type: renault
#     title: Zoe
#     capacity: 60 # kWh
#     user: myuser
#     password: mypassword
#     vin: WREN...
#     onIdentify:
#       # set defaults when vehicle is identified
#       minSoC: 20
#       targetSoC: 90

# site describes the EVU/grid connection, PV and home battery
site:
  title: Home
  meters:
    grid: grid

    # newer syntax uses "pv", not "pvs"
    pv:
      - pv

    # newer syntax uses list syntax for battery meters
    battery:
      - battery

  # give home battery priority up to this SoC
  # empty disables the setting
  prioritySoC:

  # ignore home battery discharge above this SoC
  # empty disables the setting
  bufferSoC:

# loadpoint describes the charger, charge meter and connected vehicle
loadpoints:
  - title: Loadpoint
    charger: wallbox

    # vehicle: audi
    #
    # vehicles:
    #   use this if multiple vehicles are allowed to charge on this loadpoint
    #   - ID.3
    #   - e-Up

    mode: pv

    # resetOnDisconnect was valid in older configs but is rejected by newer evcc versions.
    # Charge defaults are now generally handled by evcc UI/state/database.
    #
    # resetOnDisconnect: true

    soc:
      # polling defines usage of vehicle APIs
      # Modifying the default settings is NOT recommended.
      # It may deplete your vehicle's battery or lead to vehicle manufacturer API bans.
      # USE AT YOUR OWN RISK.
      poll:
        # poll mode defines under which condition the vehicle API is called:
        #   charging: update vehicle only when charging, recommended default
        #   connected: update vehicle when connected, not only charging
        #   always: always update vehicle regardless of connection state
        mode: charging

        # poll interval defines how often the vehicle API may be polled if not charging
        interval: 60m

      # These older keys are rejected by newer evcc versions:
      #
      # min: 20
      # target: 100
      #
      # Use evcc UI/state/vehicle defaults instead.

      estimate: false

    # EV phases
    # default is 3
    phases: 3

    # PV mode enable behavior
    enable:
      # threshold must be exceeded for this long
      delay: 1m

      # grid power threshold in Watts
      # negative = export
      # if zero, export must exceed minimum charge power to enable
      threshold: 0

    # PV mode disable behavior
    disable:
      # threshold must be exceeded for this long
      delay: 10m

      # maximum import power in Watts
      threshold: 200

    # switch charger contactor not more often than this
    # default is 10m
    guardDuration: 5m

    # minimum charge current
    # default is 6A
    minCurrent: 6

    # maximum charge current
    maxCurrent: 16

# tariffs are the fixed or variable tariffs
# cheap tariffs, for example tibber or awattar, can be used to define a tariff rate
# considered cheap enough for charging
tariffs:
  currency: EUR # three-letter ISO-4217 currency code

  grid:
    # static grid price
    type: fixed
    price: 0.312 # EUR/kWh

    # or variable via tibber
    #
    # type: tibber
    # cheap: 0.2 # EUR/kWh
    # token: "your-token"
    # homeid: "your-home-id" # optional if multiple homes are associated to account

    # or variable via awattar
    #
    # type: awattar
    # cheap: 0.2 # EUR/kWh
    # region: de # optional, choose "at" for Austria

  feedin:
    # rate for feeding excess PV energy to the grid
    type: fixed
    price: 0.0822 # EUR/kWh

# mqtt message broker
mqtt:
  broker: mosquitto:1883
  topic: evcc # root topic for publishing, set empty to disable

# user:
# password:

# influx database
influx:
  url: http://influxdb:8086
  database: monitoring
  # user:
  # password:

# eebus credentials
eebus:
  # uri: :4712

  # limit eebus to specific network interfaces
  # interfaces:
  #   - en0

  # local signed certificate, required for eebus
  # can be generated via: evcc eebus-cert
  # certificate:
  #   public:
  #   private:

# push messages
messaging:
  events:
    start:
      title: Charge started
      msg: Started charging in "${mode}" mode

    stop:
      title: Charge finished
      msg: Finished charging ${chargedEnergy:%.1fk}kWh in ${chargeDuration}.

    connect:
      title: Car connected
      msg: "Car connected at ${pvPower:%.1fk}kW PV"

    disconnect:
      title: Car disconnected
      msg: Car disconnected after ${connectedDuration}

  services:
    []
    # - type: pushover
    #   app: # app id
    #   recipients:
    #     - # recipient id

    # - type: telegram
    #   token: # bot id
    #   chats:
    #     - # chat id

    # - type: email
    #   uri: smtp://<user>:<password>@<host>:<port>/?fromAddress=<from>&toAddresses=<to>
